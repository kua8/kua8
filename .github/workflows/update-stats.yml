name: Update stats

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install github-readme-terminal==0.0.3 imageio-ffmpeg==0.7.0
      - name: Render card and GIF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python build_stats_card.py stats-card.svg
          python build_contributions.py contributions.svg
          mkdir "$RUNNER_TEMP/gif"
          cd "$RUNNER_TEMP/gif"
          python "$GITHUB_WORKSPACE/build_gif.py" "$GITHUB_WORKSPACE/output.gif"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add output.gif stats-card.svg contributions.svg
          git diff --cached --quiet || { git commit -m "chore: update stats"; git push; }
